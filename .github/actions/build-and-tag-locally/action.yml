name: Build and Test
description: Build and test redis docker image

inputs:
  distribution:
    description: "Distribution flavor"
    default: "debian"
  platform:
    description: "Platform"
    required: true
  publish_image:
    description: "Publish image to Docker Hub"
    default: "false"
  registry_username:
    description: "Docker Hub username"
    required: false
  registry_password:
    description: "Docker Hub password"
    required: false
  registry_repository:
    description: 'Repository to push the image to'
    required: false
  release_tag:
    description: 'Release tag to build'
    required: false
  redisearch_version:
    description: 'Redisearch version to build'
    required: false
  redisjson_version:
    description: 'Redisjson version to build'
    required: false
  redisbloom_version:
    description: 'Redisbloom version to build'
    required: false
  redistimeseries_version:
    description: 'Redistimeseries version to build'
    required: false
  run_type:
    description: 'Run type, either release, pr, nightly, unstable or custom'
    required: true
  custom_build:
    description: 'Whether to render and build using the custom/module-oriented path'
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install QEMU
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Calculate architecture name
      id: platform
      shell: bash
      run: |
        case ${{ inputs.platform }} in
          linux/amd64)
            plaform_name="amd64"
            ;;
          linux/arm64)
            plaform_name="arm64"
            ;;
          linux/arm/v5)
            plaform_name="arm-v5"
            ;;
          linux/arm/v6)
            plaform_name="arm-v6"
            ;;
          linux/arm/v7)
            plaform_name="arm-v7"
            ;;
          linux/i386)
            plaform_name="i386"
            ;;
          linux/ppc64le)
            plaform_name="ppc64le"
            ;;
          linux/riscv64)
            plaform_name="riscv64"
            ;;
          linux/s390x)
            plaform_name="s390x"
            ;;
          *)
            echo "Architecture not supported: ${{ inputs.platform }}"
            exit 1
            ;;
        esac
        echo "display_name=$plaform_name" >> "$GITHUB_OUTPUT"

    - name: Clean up
      shell: bash
      run: |
        docker rm -f sanity-test-${{ steps.platform.outputs.display_name }} || true
        docker rmi -f ${{ github.sha }}:${{ steps.platform.outputs.display_name }} || true

    - name: Docker Login
      uses: docker/login-action@v3
      if: inputs.publish_image == 'true'
      with:
        registry: ${{ inputs.registry_repository }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Redis release archive
      shell: bash
      if: inputs.run_type != 'release' && inputs.run_type != 'pr'
      env:
        TAG: ${{ inputs.release_tag }}
      run: |
        # Figure out the correct URL for the Redis release archive
        REDIS_DOWNLOAD_URL=""
        for URL in \
          "https://github.com/redis/redis/archive/refs/tags/$TAG.tar.gz" \
          "https://github.com/redis/redis/archive/refs/heads/$TAG.tar.gz" \
          "https://github.com/redis/redis/archive/$TAG.tar.gz"; do
          if curl --fail -sS -IL -w "%{http_code} %{url}\n" "$URL" -o /dev/null; then
            REDIS_DOWNLOAD_URL=$URL
            echo "REDIS_DOWNLOAD_URL=$URL" | tee -a "$GITHUB_ENV"
            break
          fi
        done
        if [ -z "$REDIS_DOWNLOAD_URL" ]; then
          echo "Failed to find Redis release archive"
          exit 1
        fi

    - name: Install release automation dependencies
      uses: ./.github/actions/release-automation-install

    - name: Render Dockerfiles for custom or unstable build
      shell: bash
      if: inputs.run_type != 'release' && inputs.run_type != 'pr' && inputs.custom_build == 'true'
      run: |
        ./bin/render-all-dockerfiles.sh -s custom_build true -s redis_download_url $REDIS_DOWNLOAD_URL

    - name: Build
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.distribution }}
        push: false
        load: true
        platforms: ${{ inputs.platform }}
        tags: ${{ github.sha }}:${{ steps.platform.outputs.display_name }}
        cache-from: ${{ inputs.run_type == 'release' && format('type=gha,scope={0}-{1}', inputs.distribution, steps.platform.outputs.display_name) || '' }}
        cache-to: ${{ inputs.run_type == 'release' && format('type=gha,mode=max,scope={0}-{1}', inputs.distribution, steps.platform.outputs.display_name) || '' }}
        build-args: |
          REDISEARCH_VERSION=${{ inputs.redisearch_version }}
          REDISJSON_VERSION=${{ inputs.redisjson_version }}
          REDISBLOOM_VERSION=${{ inputs.redisbloom_version }}
          REDISTIMESERIES_VERSION=${{ inputs.redistimeseries_version }}

    - name: Capture build logs on failure
      shell: bash
      if: failure() && steps.build.outcome == 'failure' && inputs.run_type == 'nightly'
      run: |
        mkdir -p /tmp/build-logs

        echo "Build failed for ${{ inputs.distribution }} on ${{ inputs.platform }}"
        echo "Capturing detailed logs for troubleshooting..."

        # Get docker history for the built image (might not exist if build failed early)
        docker history ${{ github.sha }}:${{ steps.platform.outputs.display_name }} > /tmp/build-logs/image-history.log 2>&1 || echo "Failed to get image history"

        # Get docker inspect output (might not exist if build failed early)
        docker inspect ${{ github.sha }}:${{ steps.platform.outputs.display_name }} > /tmp/build-logs/image-inspect.json 2>&1 || echo "Failed to inspect image"

        # Get docker build cache info
        docker buildx du > /tmp/build-logs/buildx-du.log 2>&1 || echo "Failed to get build cache info"

        # Get system info
        uname -a > /tmp/build-logs/system-info.log 2>&1
        docker info > /tmp/build-logs/docker-info.log 2>&1

        # Create a summary file
        {
          echo "Build failure summary for ${{ inputs.distribution }} on ${{ inputs.platform }}"
          echo "Date: $(date)"
          echo "GitHub SHA: ${{ github.sha }}"
          echo "Platform: ${{ steps.platform.outputs.display_name }}"
          echo "Distribution: ${{ inputs.distribution }}"
        } > /tmp/build-logs/failure-summary.txt

        # Try to extract error information from the build logs
        echo "Analyzing build failure..."

        # Check for common error patterns
        if docker buildx build --no-cache ${{ inputs.distribution }} --platform=${{ inputs.platform }} 2>&1 | tee /tmp/build-logs/build-error.log | grep -q "ERROR"; then
          echo "Found ERROR in build output"
          grep -A 10 -B 5 "ERROR" /tmp/build-logs/build-error.log > /tmp/build-logs/error-context.log || true
        fi

        echo "Log capture complete"

    - name: Upload build failure logs
      if: failure() && steps.build.outcome == 'failure' && inputs.run_type == 'nightly'
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-${{ steps.platform.outputs.display_name }}-${{ inputs.distribution }}
        path: /tmp/build-logs/
        retention-days: 30
        if-no-files-found: warn

    - name: Run container
      shell: bash
      if: ${{ contains(fromJSON('["amd64", "i386", "arm64"]'), steps.platform.outputs.display_name) }}
      run: |
        docker run -d --name sanity-test-${{ steps.platform.outputs.display_name }} ${{ github.sha }}:${{ steps.platform.outputs.display_name }}

    - name: Container Logs
      if: ${{ contains(fromJSON('["amd64", "i386", "arm64"]'), steps.platform.outputs.display_name) }}
      shell: bash
      run: |
        docker logs sanity-test-${{ steps.platform.outputs.display_name }}

    - name: Sanity Tests
      if: ${{ contains(fromJSON('["amd64", "i386", "arm64"]'), steps.platform.outputs.display_name) }}
      shell: bash
      env:
        CONTAINER_NAME: sanity-test-${{ steps.platform.outputs.display_name }}
      run: |
        ATTEMPTS=0
        PING_OK=""
        while [[ $(( ATTEMPTS++ )) < 5 ]]; do
          if docker exec "$CONTAINER_NAME" redis-cli ping; then
            PING_OK=1
            break;
          fi
          sleep 1
        done
        if [ -z "$PING_OK" ]; then
          echo "::error::Redis failed to respond after $ATTEMPTS attempts"
          docker logs "$CONTAINER_NAME"
          exit 1
        fi
        docker exec "$CONTAINER_NAME" redis-cli info server

    - name: Format registry tag
      id: format-registry-tag
      if: ${{ inputs.publish_image == 'true' && contains(fromJSON('["amd64", "arm64"]'), steps.platform.outputs.display_name) }}
      shell: bash
      run: |
        if [[ "${{ inputs.run_type }}" == "release" ]]; then
          tag_prefix="${{ inputs.release_tag }}"
        elif [[ "${{ inputs.run_type }}" == "unstable" || "${{ inputs.run_type }}" == "nightly" ]]; then
          tag_prefix="unstable"
        elif [[ "${{ inputs.run_type }}" == "custom" ]]; then
          tag_prefix="custom"
        else
          echo "Wrong run_type value, available options are release, nightly, unstable and custom"
          exit 1
        fi

        printf "tag=%s:%s-%s-%s-%s" \
          "${{ inputs.registry_repository }}" \
          "${tag_prefix}" \
          "${{ github.run_id }}" \
          "${{ inputs.distribution }}" \
          "${{ steps.platform.outputs.display_name }}" \
          | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

    - name: Image labels
      if: ${{ inputs.publish_image == 'true' && contains(fromJSON('["amd64", "arm64"]'), steps.platform.outputs.display_name) }}
      id: get-image-labels
      uses: ./.github/actions/create-image-labels
      with:
          redis_version: ${{ inputs.release_tag }}
          redisearch_version: ${{ inputs.redisearch_version }}
          redisjson_version: ${{ inputs.redisjson_version }}
          redisbloom_version: ${{ inputs.redisbloom_version }}
          redistimeseries_version: ${{ inputs.redistimeseries_version }}

    - name: Push image
      uses: docker/build-push-action@v6
      if: ${{ inputs.publish_image == 'true' && contains(fromJSON('["amd64", "arm64"]'), steps.platform.outputs.display_name) }}
      with:
        context: ${{ inputs.distribution }}
        push: true
        tags: ${{ steps.format-registry-tag.outputs.tag }}
        cache-from: ${{ inputs.run_type == 'release' && 'type=gha' || '' }}
        cache-to: ${{ inputs.run_type == 'release' && 'type=gha,mode=max' || '' }}
        build-args: |
          REDISEARCH_VERSION=${{ inputs.redisearch_version }}
          REDISJSON_VERSION=${{ inputs.redisjson_version }}
          REDISBLOOM_VERSION=${{ inputs.redisbloom_version }}
          REDISTIMESERIES_VERSION=${{ inputs.redistimeseries_version }}
          ${{ inputs.run_type != 'release' && 'CUSTOM_BUILD=true' || '' }}
          ${{ inputs.run_type != 'release' && format('REDIS_DOWNLOAD_URL={0}', env.REDIS_DOWNLOAD_URL) || '' }}
        labels: |
            ${{ steps.get-image-labels.outputs.image-labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

    - name: Save image metadata to artifact
      shell: bash
      run: |
        if [[ "${{ inputs.publish_image }}" == "true" && "${{ contains(fromJSON('["amd64", "arm64"]'), steps.platform.outputs.display_name) }}" == "true" ]]; then
          # Create a JSON file with structured image metadata
          mkdir -p /tmp/image-metadata
          cat > "/tmp/image-metadata/${{ inputs.distribution }}-${{ steps.platform.outputs.display_name }}.json" << 'EOF'
          {
            "version": "${{ inputs.release_tag }}",
            "arch": "${{ steps.platform.outputs.display_name }}",
            "distro": "${{ inputs.distribution }}",
            "commit": "${{ github.sha }}",
            "url": "${{ steps.format-registry-tag.outputs.tag }}"
          }
        EOF
          echo "Image metadata saved:"
          cat "/tmp/image-metadata/${{ inputs.distribution }}-${{ steps.platform.outputs.display_name }}.json"
        else
          echo "Image not published for this platform/distribution combination"
        fi

    - name: Upload image metadata artifact
      uses: actions/upload-artifact@v4
      if: ${{ inputs.publish_image == 'true' && contains(fromJSON('["amd64", "arm64"]'), steps.platform.outputs.display_name) }}
      with:
        name: image-metadata-${{ inputs.distribution }}-${{ steps.platform.outputs.display_name }}
        path: /tmp/image-metadata/${{ inputs.distribution }}-${{ steps.platform.outputs.display_name }}.json
        retention-days: 1
